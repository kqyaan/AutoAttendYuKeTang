      - name: Install dependencies
        run: yarn install --registry https://registry.npmmirror.com

      - name: Run
        run: node src/index.js
        env:
          USER_INFO: ${{ secrets.USER_INFO }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          BARK_ID: ${{ secrets.BARK_ID }}

  Run3:
